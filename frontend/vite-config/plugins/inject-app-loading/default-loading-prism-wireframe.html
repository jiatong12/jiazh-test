<style data-app-loading="inject-css">
  :root {
    --app-loading-primary: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)));
    --app-loading-primary-soft: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 24%);
    --app-loading-primary-glow: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 45%);
    --app-loading-line: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 56%);
    --app-loading-line-strong: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 82%);
    --app-loading-file-hint: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 14%);
    --app-loading-file-line: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 11%);
    --app-loading-panel-border: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 70%);
    --app-loading-panel-bg: transparent;
    --app-loading-panel-shadow: none;
    --app-loading-panel-hint-border: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 11%);
    --app-loading-panel-hint-opacity: 0.28;
    --app-loading-bg-radial: radial-gradient(
      circle at 50% 15%,
      rgb(255 255 255 / 88%) 0%,
      hsl(0 0 50 / 10%) 42%,
      hsl(0 0 50 / 18%) 100%
    );
    --app-loading-bg-linear: linear-gradient(160deg, #f8fcff 0%, hsl(0 0 50 / 8%) 54%, hsl(0 0 50 / 14%) 100%);
    --app-loading-grid-line-x: hsl(0 0 50 / 22%);
    --app-loading-grid-line-y: hsl(0 0 50 / 18%);
    --app-loading-grid-opacity: 0.5;
    --app-loading-particle-border: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 52%);
    --app-loading-particle-core: rgb(255 255 255 / 100%);
    --app-loading-particle-mid: var(--app-loading-line-strong);
    --app-loading-particle-tail: hsl(0 0 50 / 72%);
    --app-loading-particle-shadow-ring-color: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 16%);
    --app-loading-particle-shadow-near-color: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 48%);
    --app-loading-particle-shadow-far-color: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 34%);
    --app-loading-particle-bg: transparent;
    --app-loading-particle-shadow: none;
    --app-loading-title-color: rgb(11 23 40 / 88%);
    --app-loading-title-shadow: 0 1px 10px rgb(255 255 255 / 52%);
    --app-loading-subtitle-color: rgb(36 66 104 / 68%);
    --app-loading-progress-bg: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 18%);
    --app-loading-progress-shadow-inset: inset 0 0 0 1px hsl(0 0 50 / 18%);
    --app-loading-progress-shadow-outline: 0 0 0 1px rgb(255 255 255 / 34%);
  }

  #__app-loading__ {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--app-loading-bg-radial), var(--app-loading-bg-linear);
  }

  #__app-loading__.hidden {
    pointer-events: none;
    visibility: hidden;
    opacity: 0;
    transition: all 0.72s ease-out;
  }

  #__app-loading__ .app-loading-grid {
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(90deg, rgb(255 255 255 / 0%) 0 38px, var(--app-loading-grid-line-x) 38px 39px),
      repeating-linear-gradient(0deg, rgb(255 255 255 / 0%) 0 38px, var(--app-loading-grid-line-y) 38px 39px);
    transform: perspective(560px) rotateX(60deg) translateY(28%);
    transform-origin: center;
    opacity: var(--app-loading-grid-opacity);
    animation: grid-shift 2.8s linear infinite;
  }

  .dark #__app-loading__ {
    --app-loading-bg-radial: radial-gradient(circle at 50% 24%, #444444 0%, #111111 50%, #000000 100%);
    --app-loading-bg-linear: linear-gradient(160deg, #0a1324 0%, #080e1d 100%);
    --app-loading-grid-line-x: rgb(222 222 222 / 24%);
    --app-loading-grid-line-y: rgb(222 222 222 / 20%);
    --app-loading-grid-opacity: 0.35;
    --app-loading-particle-border: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 60%);
    --app-loading-particle-core: rgb(255 255 255 / 96%);
    --app-loading-particle-mid: hsl(0 0 50 / 84%);
    --app-loading-particle-tail: hsl(0 0 50 / 68%);
    --app-loading-particle-shadow-ring-color: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 20%);
    --app-loading-particle-shadow-near-color: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 56%);
    --app-loading-particle-shadow-far-color: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 42%);
    --app-loading-particle-bg: transparent;
    --app-loading-title-color: rgb(242 247 255 / 90%);
    --app-loading-title-shadow: 0 2px 16px rgb(5 10 22 / 74%);
    --app-loading-subtitle-color: rgb(190 214 246 / 78%);
    --app-loading-progress-bg: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 14%);
    --app-loading-progress-shadow-inset: inset 0 0 0 1px rgb(255 255 255 / 14%);
    --app-loading-progress-shadow-outline: 0 0 0 1px rgb(0 0 0 / 24%);
  }

  #__app-loading__ .app-loading-stage {
    position: relative;
    width: 280px;
    height: 230px;
    display: grid;
    place-items: center;
    perspective: 880px;
  }

  #__app-loading__ .app-loading-prism {
    position: relative;
    width: 88px;
    height: 122px;
    transform-style: preserve-3d;
    will-change: transform;
    animation: prism-spin 2.2s linear infinite;
  }

  #__app-loading__ .app-loading-prism-face {
    position: absolute;
    inset: 0;
    border: 1px solid var(--app-loading-panel-border);
    outline: 1px solid transparent;
    overflow: hidden;
    background: var(--app-loading-panel-bg);
    transform-style: preserve-3d;
    box-shadow: var(--app-loading-panel-shadow);
    backdrop-filter: blur(1.6px);
  }

  #__app-loading__ .app-loading-prism-face::before {
    position: absolute;
    inset: 9px 9px 11px;
    content: '';
    border: 1px solid var(--app-loading-panel-hint-border);
    background: none;
    opacity: var(--app-loading-panel-hint-opacity);
    pointer-events: none;
  }

  #__app-loading__ .app-loading-prism-face::after {
    position: absolute;
    inset: 0;
    content: '';
    pointer-events: none;
    background: none;
    opacity: 0.66;
  }

  #__app-loading__ .app-loading-prism-face--1 {
    transform: rotateY(0deg) translateZ(50.4px);
  }

  #__app-loading__ .app-loading-prism-face--2 {
    transform: rotateY(120deg) translateZ(51px);
  }

  #__app-loading__ .app-loading-prism-face--3 {
    transform: rotateY(240deg) translateZ(51.6px);
  }

  #__app-loading__ .app-loading-particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  #__app-loading__ .app-loading-particles > i {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1px solid var(--app-loading-particle-border);
    background: var(--app-loading-particle-bg);
    box-shadow: var(--app-loading-particle-shadow);
    animation: particle-fly 2.4s ease-in-out infinite;
    animation-delay: var(--delay);
    left: var(--x);
    top: var(--y);
  }

  #__app-loading__ .app-loading-particles > i:nth-child(1) {
    --x: 24px;
    --y: 62px;
    --delay: 0s;
  }

  #__app-loading__ .app-loading-particles > i:nth-child(2) {
    --x: 68px;
    --y: 26px;
    --delay: 0.25s;
  }

  #__app-loading__ .app-loading-particles > i:nth-child(3) {
    --x: 220px;
    --y: 36px;
    --delay: 0.5s;
  }

  #__app-loading__ .app-loading-particles > i:nth-child(4) {
    --x: 250px;
    --y: 98px;
    --delay: 0.75s;
  }

  #__app-loading__ .app-loading-particles > i:nth-child(5) {
    --x: 44px;
    --y: 172px;
    --delay: 1s;
  }

  #__app-loading__ .app-loading-particles > i:nth-child(6) {
    --x: 210px;
    --y: 178px;
    --delay: 1.25s;
  }

  #__app-loading__ .app-loading-title {
    margin-top: 30px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 1px;
    color: var(--app-loading-title-color);
    text-shadow: var(--app-loading-title-shadow);
  }

  #__app-loading__ .app-loading-subtitle {
    margin-top: 10px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--app-loading-subtitle-color);
  }

  #__app-loading__ .app-loading-subtitle::after {
    content: '...';
    display: inline-block;
    width: 0;
    overflow: hidden;
    vertical-align: bottom;
    animation: loading-dots 1.1s steps(4, end) infinite;
  }

  #__app-loading__ .app-loading-progress {
    position: relative;
    margin-top: 10px;
    width: 168px;
    height: 4px;
    overflow: hidden;
    border-radius: 999px;
    background: var(--app-loading-progress-bg);
    box-shadow: var(--app-loading-progress-shadow-inset), var(--app-loading-progress-shadow-outline);
  }

  #__app-loading__ .app-loading-progress::before {
    position: absolute;
    top: 0;
    left: -40%;
    width: 40%;
    height: 100%;
    content: '';
    border-radius: inherit;
    background: linear-gradient(
      90deg,
      hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 20%) 0%,
      hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 85%) 100%
    );
    box-shadow: 0 0 12px hsl(0 0 50 / 48%);
    animation: loading-bar-run 1.2s ease-in-out infinite;
  }

  @keyframes grid-shift {
    from {
      transform: perspective(560px) rotateX(60deg) translateY(28%) translateX(0);
    }

    to {
      transform: perspective(560px) rotateX(60deg) translateY(28%) translateX(39px);
    }
  }

  @keyframes prism-spin {
    0% {
      transform: translateY(10px) rotateX(-8deg) rotateY(0deg);
    }

    50% {
      transform: translateY(0) rotateX(8deg) rotateY(180deg);
    }

    100% {
      transform: translateY(10px) rotateX(-8deg) rotateY(360deg);
    }
  }

  @keyframes particle-fly {
    0%,
    100% {
      opacity: 0.36;
      transform: translate3d(0, 0, 0) scale(0.7);
    }

    45% {
      opacity: 1;
      transform: translate3d(0, -16px, 0) scale(1.08);
    }
  }

  @keyframes loading-dots {
    0% {
      width: 0;
    }

    100% {
      width: 3ch;
    }
  }

  @keyframes loading-bar-run {
    0% {
      left: -42%;
      width: 34%;
    }

    50% {
      width: 46%;
    }

    100% {
      left: 104%;
      width: 32%;
    }
  }
</style>
<div id="__app-loading__">
  <div class="app-loading-grid" aria-hidden="true"></div>
  <div class="app-loading-stage" aria-hidden="true">
    <div class="app-loading-prism">
      <div class="app-loading-prism-face app-loading-prism-face--1"></div>
      <div class="app-loading-prism-face app-loading-prism-face--2"></div>
      <div class="app-loading-prism-face app-loading-prism-face--3"></div>
    </div>
    <div class="app-loading-particles">
      <i></i>
      <i></i>
      <i></i>
      <i></i>
      <i></i>
      <i></i>
    </div>
  </div>
  <div class="app-loading-title"><%= title %></div>
  <div class="app-loading-subtitle">加载中</div>
  <div class="app-loading-progress" aria-hidden="true"></div>
</div>
