<style data-app-loading="inject-css">
  :root {
    --app-loading-primary: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)));
    --app-loading-primary-soft: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 20%);
    --app-loading-primary-strong: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 75%);
  }

  #__app-loading__ {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
      radial-gradient(circle at 50% 32%, rgb(255 255 255 / 95%) 0%, #eef3f8 54%, #e3eaf3 100%),
      linear-gradient(120deg, #f8fbff 0%, #edf3fa 100%);
  }

  #__app-loading__.hidden {
    pointer-events: none;
    visibility: hidden;
    opacity: 0;
    transition: all 0.7s ease-out;
  }

  .dark #__app-loading__ {
    background:
      radial-gradient(circle at 50% 24%, rgb(31 44 61 / 85%) 0%, #111827 58%, #090f1c 100%),
      linear-gradient(130deg, #0a1324 0%, #0a1020 100%);
  }

  #__app-loading__ .app-loading-scene {
    position: relative;
    width: 220px;
    height: 220px;
    display: grid;
    place-items: center;
    transform-style: preserve-3d;
  }

  #__app-loading__ .app-loading-aurora {
    position: absolute;
    width: 210px;
    height: 210px;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      rgb(255 255 255 / 0%) 0deg,
      var(--app-loading-primary-soft) 78deg,
      var(--app-loading-primary-strong) 160deg,
      rgb(255 255 255 / 0%) 270deg
    );
    filter: blur(0.6px);
    animation: aurora-spin 2.4s linear infinite;
  }

  #__app-loading__ .app-loading-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgb(255 255 255 / 40%);
    box-shadow: inset 0 0 16px rgb(255 255 255 / 20%);
  }

  #__app-loading__ .app-loading-ring--outer {
    width: 188px;
    height: 188px;
    animation: ring-tilt-outer 2.6s ease-in-out infinite;
  }

  #__app-loading__ .app-loading-ring--inner {
    width: 140px;
    height: 140px;
    border-color: var(--app-loading-primary-soft);
    box-shadow: inset 0 0 18px var(--app-loading-primary-soft);
    animation: ring-tilt-inner 1.8s ease-in-out infinite;
  }

  #__app-loading__ .app-loading-orbit {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--app-loading-primary);
    box-shadow:
      0 0 0 5px hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 15%),
      0 0 24px hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 35%);
  }

  #__app-loading__ .app-loading-orbit--a {
    animation: orbit-a 1.7s linear infinite;
  }

  #__app-loading__ .app-loading-orbit--b {
    width: 8px;
    height: 8px;
    opacity: 0.8;
    animation: orbit-b 2.3s linear infinite;
  }

  #__app-loading__ .app-loading-orbit--c {
    width: 10px;
    height: 10px;
    opacity: 0.9;
    animation: orbit-c 2s linear infinite;
  }

  #__app-loading__ .app-loading-core {
    position: relative;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: radial-gradient(
      circle at 30% 28%,
      rgb(255 255 255 / 95%) 0 20%,
      var(--app-loading-primary) 45%,
      hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 45%) 100%
    );
    box-shadow:
      0 0 42px hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 42%),
      inset 0 -8px 18px rgb(0 0 0 / 12%);
    animation: core-pulse 1.2s ease-in-out infinite;
  }

  #__app-loading__ .app-loading-core::after {
    position: absolute;
    top: 16px;
    left: 16px;
    width: 40px;
    height: 40px;
    content: '';
    border-radius: 50%;
    background: rgb(255 255 255 / 30%);
    filter: blur(2px);
  }

  #__app-loading__ .app-loading-title {
    margin-top: 34px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 1px;
    color: rgb(12 24 42 / 88%);
    text-shadow: 0 1px 8px rgb(255 255 255 / 45%);
  }

  .dark #__app-loading__ .app-loading-title {
    color: rgb(244 248 255 / 88%);
    text-shadow: 0 2px 16px rgb(6 12 24 / 68%);
  }

  @keyframes aurora-spin {
    from {
      transform: rotate(0deg) scale(1);
      opacity: 0.92;
    }

    50% {
      opacity: 1;
      transform: rotate(180deg) scale(1.04);
    }

    to {
      transform: rotate(360deg) scale(1);
      opacity: 0.92;
    }
  }

  @keyframes ring-tilt-outer {
    0%,
    100% {
      transform: rotateX(66deg) rotateY(-8deg) rotateZ(0deg);
    }

    50% {
      transform: rotateX(74deg) rotateY(10deg) rotateZ(180deg);
    }
  }

  @keyframes ring-tilt-inner {
    0%,
    100% {
      transform: rotateX(-72deg) rotateY(14deg) rotateZ(0deg);
    }

    50% {
      transform: rotateX(-60deg) rotateY(-10deg) rotateZ(180deg);
    }
  }

  @keyframes orbit-a {
    0% {
      transform: rotate(0deg) translateX(98px) rotate(0deg);
    }

    100% {
      transform: rotate(360deg) translateX(98px) rotate(-360deg);
    }
  }

  @keyframes orbit-b {
    0% {
      transform: rotate(48deg) translateX(66px) rotate(-48deg);
    }

    100% {
      transform: rotate(-312deg) translateX(66px) rotate(312deg);
    }
  }

  @keyframes orbit-c {
    0% {
      transform: rotate(180deg) translateX(82px) rotate(-180deg);
    }

    100% {
      transform: rotate(540deg) translateX(82px) rotate(-540deg);
    }
  }

  @keyframes core-pulse {
    0%,
    100% {
      transform: scale(1);
      box-shadow:
        0 0 36px hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 36%),
        inset 0 -8px 18px rgb(0 0 0 / 12%);
    }

    50% {
      transform: scale(1.08);
      box-shadow:
        0 0 54px hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 54%),
        inset 0 -10px 20px rgb(0 0 0 / 16%);
    }
  }
</style>
<div id="__app-loading__">
  <div class="app-loading-scene" aria-hidden="true">
    <div class="app-loading-aurora"></div>
    <div class="app-loading-ring app-loading-ring--outer"></div>
    <div class="app-loading-ring app-loading-ring--inner"></div>
    <span class="app-loading-orbit app-loading-orbit--a"></span>
    <span class="app-loading-orbit app-loading-orbit--b"></span>
    <span class="app-loading-orbit app-loading-orbit--c"></span>
    <div class="app-loading-core"></div>
  </div>
  <div class="app-loading-title"><%= title %></div>
</div>
