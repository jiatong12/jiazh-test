<style data-app-loading="inject-css">
  :root {
    --app-loading-primary: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)));
    --app-loading-primary-soft: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 22%);
    --app-loading-primary-glow: hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 48%);
    --app-loading-cool-1: color-mix(in srgb, var(--app-loading-primary) 36%, #fff);
    --app-loading-cool-2: var(--app-loading-primary);
    --app-loading-cool-3: color-mix(in srgb, var(--app-loading-primary) 62%, #23385f);
    --app-loading-warm-1: color-mix(in srgb, var(--app-loading-primary) 44%, #ffd4ad);
    --app-loading-warm-2: color-mix(in srgb, var(--app-loading-primary) 52%, #ffbddf);
    --app-loading-warm-3: color-mix(in srgb, var(--app-loading-primary) 42%, #ffe7a2);
    --app-loading-plant-1: color-mix(in srgb, var(--app-loading-primary) 46%, #9ce6c1);
    --app-loading-plant-2: color-mix(in srgb, var(--app-loading-primary) 56%, #5ec08b);
    --app-loading-eye: color-mix(in srgb, var(--app-loading-primary) 58%, #0d2139);
    --app-loading-eye-ring: rgb(255 255 255 / 58%);
  }

  #__app-loading__ {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
      radial-gradient(
        circle at 50% 15%,
        rgb(255 255 255 / 88%) 0%,
        hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 10%) 42%,
        hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 18%) 100%
      ),
      linear-gradient(
        160deg,
        #f8fcff 0%,
        hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 8%) 54%,
        hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 14%) 100%
      );
  }

  #__app-loading__.hidden {
    pointer-events: none;
    visibility: hidden;
    opacity: 0;
    transition: all 0.72s ease-out;
  }

  .dark #__app-loading__ {
    --app-loading-cool-1: color-mix(in srgb, var(--app-loading-primary) 56%, #fff);
    --app-loading-cool-2: color-mix(in srgb, var(--app-loading-primary) 72%, #d9e9ff);
    --app-loading-cool-3: color-mix(in srgb, var(--app-loading-primary) 62%, #415b96);
    --app-loading-warm-1: color-mix(in srgb, var(--app-loading-primary) 48%, #ffcca1);
    --app-loading-warm-2: color-mix(in srgb, var(--app-loading-primary) 52%, #f6b2df);
    --app-loading-warm-3: color-mix(in srgb, var(--app-loading-primary) 46%, #f6db8e);
    --app-loading-plant-1: color-mix(in srgb, var(--app-loading-primary) 48%, #90d7b2);
    --app-loading-plant-2: color-mix(in srgb, var(--app-loading-primary) 58%, #5eb080);
    --app-loading-eye: color-mix(in srgb, var(--app-loading-primary) 58%, #0d2139);
    --app-loading-eye-ring: rgb(255 255 255 / 58%);
    background:
      radial-gradient(
        circle at 50% 13%,
        color-mix(in srgb, var(--app-loading-primary) 22%, #21365b) 0%,
        color-mix(in srgb, var(--app-loading-primary) 14%, #121f38) 44%,
        #0a1324 100%
      ),
      linear-gradient(
        160deg,
        color-mix(in srgb, var(--app-loading-primary) 12%, #0f1a30) 0%,
        color-mix(in srgb, var(--app-loading-primary) 10%, #0d172a) 56%,
        #0b1426 100%
      );
  }

  #__app-loading__ .app-loading-noise {
    position: absolute;
    inset: -20%;
    opacity: 0.25;
    background:
      radial-gradient(circle at 13% 24%, rgb(255 255 255 / 72%) 0 1px, rgb(255 255 255 / 0%) 2px),
      radial-gradient(circle at 84% 18%, rgb(255 255 255 / 72%) 0 1px, rgb(255 255 255 / 0%) 2px),
      radial-gradient(circle at 75% 75%, rgb(255 255 255 / 72%) 0 1px, rgb(255 255 255 / 0%) 2px),
      radial-gradient(circle at 19% 72%, rgb(255 255 255 / 72%) 0 1px, rgb(255 255 255 / 0%) 2px),
      radial-gradient(circle at 52% 48%, rgb(255 255 255 / 72%) 0 1px, rgb(255 255 255 / 0%) 2px);
    animation: noise-drift 6.8s ease-in-out infinite;
  }

  .dark #__app-loading__ .app-loading-noise {
    opacity: 0.46;
  }

  #__app-loading__ .app-loading-scene {
    position: relative;
    width: 370px;
    height: 270px;
    display: grid;
    place-items: center;
    isolation: isolate;
  }

  #__app-loading__ .app-loading-bird {
    position: absolute;
    top: 78px;
    left: 62px;
    width: 184px;
    height: 124px;
    z-index: 4;
    transform-origin: 170px 50px;
    animation: bird-hover 0.9s ease-in-out infinite;
  }

  #__app-loading__ .app-loading-wing {
    position: absolute;
    width: 106px;
    height: 88px;
    transform-style: preserve-3d;
  }

  #__app-loading__ .app-loading-wing--left {
    top: 6px;
    left: -2px;
    transform-origin: 94px 44px;
    animation: wing-flap-left 0.21s cubic-bezier(0.63, 0.03, 0.47, 1) infinite;
  }

  #__app-loading__ .app-loading-wing--right {
    top: 10px;
    left: 82px;
    transform-origin: 8px 44px;
    animation: wing-flap-right 0.21s cubic-bezier(0.63, 0.03, 0.47, 1) infinite;
  }

  #__app-loading__ .app-loading-block {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 2px;
    left: var(--x, 0);
    top: var(--y, 0);
    background: var(--c, #fff);
    box-shadow:
      inset 0 0 0 1px rgb(255 255 255 / 28%),
      0 2px 8px rgb(0 0 0 / 14%);
  }

  #__app-loading__ .app-loading-body {
    position: absolute;
    top: 38px;
    left: 66px;
    width: 54px;
    height: 42px;
    animation: body-lean 0.45s ease-in-out infinite;
  }

  #__app-loading__ .app-loading-tail {
    position: absolute;
    top: 62px;
    left: 40px;
    width: 38px;
    height: 42px;
    transform-origin: 30px 8px;
    animation: tail-sway 0.3s ease-in-out infinite;
  }

  #__app-loading__ .app-loading-eye {
    position: absolute;
    top: 50px;
    left: 110px;
    width: 7px;
    height: 7px;
    border-radius: 2px;
    background: var(--app-loading-eye);
    box-shadow: 0 0 0 2px var(--app-loading-eye-ring);
  }

  #__app-loading__ .app-loading-beak {
    position: absolute;
    top: 55px;
    left: 118px;
    width: 68px;
    height: 4px;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--app-loading-warm-1) 0%, var(--app-loading-warm-3) 100%);
    box-shadow: 0 0 10px rgb(255 190 112 / 50%);
    transform-origin: left center;
    transform: rotate(-7.2deg);
    animation: beak-probe 0.42s ease-in-out infinite;
  }

  #__app-loading__ .app-loading-sip {
    position: absolute;
    top: 45px;
    left: 178px;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    background: var(--app-loading-warm-3);
    box-shadow:
      0 0 12px rgb(255 224 128 / 84%),
      0 0 20px rgb(255 255 255 / 74%);
    transform: rotate(-7.2deg);
    animation: sip-glimmer 0.52s ease-in-out infinite;
  }

  #__app-loading__ .app-loading-flower {
    position: absolute;
    top: 102px;
    left: 236px;
    width: 108px;
    height: 126px;
    z-index: 3;
    transform-origin: 32px 110px;
    animation: flower-breathe 2.2s ease-in-out infinite;
  }

  #__app-loading__ .app-loading-flower .app-loading-block {
    width: 14px;
    height: 14px;
    border-radius: 3px;
  }

  #__app-loading__ .app-loading-flower .app-loading-flower-core {
    width: 16px;
    height: 16px;
    z-index: 2;
  }

  #__app-loading__ .app-loading-flower .app-loading-flower-throat {
    width: 20px;
    height: 10px;
    border-radius: 3px;
    z-index: 1;
  }

  #__app-loading__ .app-loading-flower .app-loading-flower-stem {
    width: 10px;
    height: 12px;
    border-radius: 2px;
  }

  #__app-loading__ .app-loading-flower .app-loading-flower-leaf {
    width: 16px;
    height: 10px;
    border-radius: 3px;
  }

  #__app-loading__ .app-loading-flower-nectar {
    position: absolute;
    top: 31px;
    left: 35px;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    background: linear-gradient(135deg, var(--app-loading-warm-3) 0%, var(--app-loading-warm-3) 100%);
    box-shadow: 0 0 15px rgb(255 214 104 / 84%);
    animation: nectar-pulse 0.7s ease-in-out infinite;
  }

  #__app-loading__ .app-loading-nectar-link {
    position: absolute;
    top: 143px;
    left: 238px;
    width: 72px;
    height: 3px;
    border-radius: 6px;
    background: linear-gradient(
      90deg,
      rgb(255 241 171 / 0%) 0%,
      rgb(255 233 145 / 90%) 48%,
      rgb(255 241 171 / 0%) 100%
    );
    transform: rotate(-10deg);
    filter: blur(0.2px);
    animation: nectar-link 0.5s ease-in-out infinite;
  }

  #__app-loading__ .app-loading-trail {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 2;
  }

  #__app-loading__ .app-loading-trail i {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    left: var(--x);
    top: var(--y);
    background: var(--c);
    box-shadow: 0 0 14px var(--c);
    animation: trail-run 0.98s ease-out infinite;
    animation-delay: var(--delay);
  }

  #__app-loading__ .app-loading-title {
    margin-top: 24px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 1px;
    color: rgb(11 27 48 / 88%);
    text-shadow: 0 1px 10px rgb(255 255 255 / 56%);
  }

  .dark #__app-loading__ .app-loading-title {
    color: rgb(240 248 255 / 90%);
    text-shadow: 0 2px 14px rgb(4 10 20 / 72%);
  }

  #__app-loading__ .app-loading-subtitle {
    margin-top: 8px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: rgb(32 64 101 / 66%);
  }

  .dark #__app-loading__ .app-loading-subtitle {
    color: rgb(188 212 244 / 70%);
  }

  #__app-loading__ .app-loading-subtitle::after {
    content: '...';
    display: inline-block;
    width: 0;
    margin-left: 2px;
    overflow: hidden;
    white-space: nowrap;
    vertical-align: bottom;
    animation: subtitle-dots 1.2s steps(4, end) infinite;
  }

  #__app-loading__ .app-loading-progress {
    position: relative;
    margin-top: 14px;
    width: 206px;
    height: 6px;
    overflow: hidden;
    border-radius: 999px;
    background: linear-gradient(
      90deg,
      rgb(255 255 255 / 58%) 0%,
      hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 18%) 100%
    );
    box-shadow:
      inset 0 0 0 1px rgb(255 255 255 / 44%),
      0 0 0 1px rgb(33 66 105 / 8%);
  }

  #__app-loading__ .app-loading-progress::before {
    content: '';
    position: absolute;
    top: 0;
    left: -42%;
    width: 40%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--app-loading-cool-2) 0%, var(--app-loading-warm-2) 100%);
    box-shadow: 0 0 12px hsl(var(--el-color-primary-hsl, var(--default-primary-hsl)) / 42%);
    animation: progress-scan 1.25s ease-in-out infinite;
  }

  .dark #__app-loading__ .app-loading-progress {
    background: linear-gradient(90deg, rgb(255 255 255 / 14%) 0%, rgb(255 255 255 / 6%) 100%);
    box-shadow:
      inset 0 0 0 1px rgb(255 255 255 / 18%),
      0 0 0 1px rgb(6 12 22 / 40%);
  }

  @keyframes noise-drift {
    0%,
    100% {
      transform: translate3d(0, 0, 0) scale(1);
      opacity: 0.25;
    }

    50% {
      transform: translate3d(-10px, 8px, 0) scale(1.05);
      opacity: 0.42;
    }
  }

  @keyframes bird-hover {
    0%,
    100% {
      transform: translate3d(-7px, 2px, 0) rotate(-8deg);
    }

    50% {
      transform: translate3d(-6px, -2px, 0) rotate(-6.6deg);
    }
  }

  @keyframes wing-flap-left {
    0%,
    100% {
      transform: rotate(42deg) rotateY(6deg) scaleY(1);
    }

    50% {
      transform: rotate(-63deg) rotateY(44deg) scaleY(0.9);
    }
  }

  @keyframes wing-flap-right {
    0%,
    100% {
      transform: rotate(-42deg) rotateY(-6deg) scaleY(1);
    }

    50% {
      transform: rotate(63deg) rotateY(-44deg) scaleY(0.9);
    }
  }

  @keyframes body-lean {
    0%,
    100% {
      transform: rotate(-2deg);
    }

    50% {
      transform: rotate(-4.2deg);
    }
  }

  @keyframes tail-sway {
    0%,
    100% {
      transform: rotate(-18deg);
    }

    50% {
      transform: rotate(-4deg);
    }
  }

  @keyframes beak-probe {
    0%,
    100% {
      transform: rotate(-7.1deg) scaleX(1);
    }

    50% {
      transform: rotate(-8.4deg) scaleX(1.02);
    }
  }

  @keyframes sip-glimmer {
    0%,
    100% {
      opacity: 0.4;
      transform: rotate(-7.2deg) scale(0.85);
    }

    50% {
      opacity: 1;
      transform: rotate(-7.2deg) scale(1.05);
    }
  }

  @keyframes flower-breathe {
    0%,
    100% {
      transform: rotate(1.2deg);
    }

    50% {
      transform: rotate(-1.8deg);
    }
  }

  @keyframes nectar-pulse {
    0%,
    100% {
      opacity: 0.48;
      transform: scale(0.86);
    }

    50% {
      opacity: 1;
      transform: scale(1.08);
    }
  }

  @keyframes nectar-link {
    0%,
    100% {
      opacity: 0.2;
      transform: rotate(-10deg) scaleX(0.9);
    }

    50% {
      opacity: 0.95;
      transform: rotate(-10deg) scaleX(1.08);
    }
  }

  @keyframes trail-run {
    0% {
      opacity: 0;
      transform: translate3d(22px, 0, 0) scale(1);
    }

    26% {
      opacity: 0.9;
    }

    100% {
      opacity: 0;
      transform: translate3d(-34px, -3px, 0) scale(0.58);
    }
  }

  @keyframes subtitle-dots {
    0% {
      width: 0;
    }

    100% {
      width: 3ch;
    }
  }

  @keyframes progress-scan {
    0% {
      left: -42%;
      width: 36%;
    }

    50% {
      width: 46%;
    }

    100% {
      left: 106%;
      width: 34%;
    }
  }
</style>
